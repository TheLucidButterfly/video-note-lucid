<div class="container-column">
    <div class="time-signature-list">
        <div class="time-signature-items">
            <p *ngFor="let notesObject of notesArray | paginate: { itemsPerPage: 5, currentPage: page }"
                class="noteBarSignatureItem clickable" (click)="selectTime(notesObject)" [ngClass]="{
                    'populated-signature': notesObject?.notes != '', 
                    'selected-signature': notesObject.timeSignature == selectedSignatureObject.timeSignature,
                    'unsaved-signature': dirtyKeys.has(notesObject.timeSignature)}">
                <span class="signature-line">
                    <span class="signature-time">{{notesObject.timeSignature | minutesFormat}}</span>
                    <span class="signature-separator">|</span>
                    <span class="signature-preview">{{ getNotePreview(notesObject?.notes) }}</span>
                </span>
            </p>
        </div>
        <pagination-controls (pageChange)="page = $event" previousLabel="" nextLabel=""></pagination-controls>
    </div>
    <textarea #textArea *ngIf="noteExists()" (click)="focusTextArea()" (input)="handleChangedText($event)" class="text-area" [(ngModel)]='selectedSignatureObject.notes' rows="5"
        cols="20"></textarea>
</div>
