<app-notes-limit-dialog *ngIf="showDialog" class="dialog" [currentView]="'activateForm'" (dialogOpen)="showDialog = $event"></app-notes-limit-dialog>
<app-notes-limit-dialog
  *ngIf="showDeleteDialog"
  class="dialog"
  [currentView]="'confirm'"
  [titleText]="'Delete file?'"
  [messageText]="'Are you sure you want to delete ' + pendingDeleteTitle + '?'"
  [confirmText]="'Yes'"
  [cancelText]="'No'"
  (dialogOpen)="showDeleteDialog = $event"
  (confirmed)="handleDeleteConfirmation($event)">
</app-notes-limit-dialog>

<div class="appContainer">
  <div *ngIf="true" class="devToolContainer">
    <span (click)="deleteAllVideoPaths();" class="delete-all-button clickable">Delete All</span>
    <br>
    <span (click)="navigateToDevTools()" class="savedAllDataButton clickable">View Saved Data</span>
    <br>
    <span *ngIf="!centralService.isPremiumUser()" (click)="showDialog = true" class="activateButton clickable">Activate</span>
  </div>
  <div class="gridContainer">
    <div (click)="openUploader()" class="gridTile clickable">+</div>
    <div *ngFor="let path of storedPaths; let i = index"  class="gridTile">
      <span class="delete-button clickable" (click)="requestDeleteVideoPath(i, path.path)">X</span>
      <span class="tileSpan clickable" (click)="nagivateToUrlScreen(i)">{{path.path | fileNameFromPath}}</span>
    </div>
  </div>
</div>
