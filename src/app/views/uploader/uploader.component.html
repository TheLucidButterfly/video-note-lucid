<div class="uploaderContainer">
  <h2 class="info-title">Info</h2>
  <div class="info-grid">
    <div class="info-card">
      <span class="info-label">Saved Files</span>
      <span class="info-value">{{ savedFileCount }}</span>
    </div>
    <div class="info-card">
      <span class="info-label">Saved Notes</span>
      <span class="info-value">{{ savedNoteCount }}</span>
    </div>
    <div class="info-card">
      <span class="info-label">Uploads Tracked</span>
      <span class="info-value">{{ userData?.videoLengthUsed || 0 }}</span>
    </div>
    <div class="info-card">
      <span class="info-label">Storage Used (bytes)</span>
      <span class="info-value">{{ userData?.videoStorageUsed || 0 }}</span>
    </div>
  </div>
</div>
